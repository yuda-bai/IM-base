services:
  # ==================== Go 后端 ====================
  ginchat:
    build: .
    container_name: ginchat-app
    environment:
      - GINCHAT_ENV=docker
      - MYSQL_USER=${MYSQL_USER:-root}
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-changeme}
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MYSQL_DATABASE=ginchat
      - REDIS_ADDR=redis:6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-changeme}
      - REDIS_DB=0
    ports:
      - "${GINCHAT_HOST_PORT:-8081}:8080"
    volumes:
      - ./uploads:/app/uploads
    depends_on:
      redis:
        condition: service_healthy
      mysql:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/index >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    networks:
      - ginchat-network

  # ==================== Redis 缓存 ====================
  redis:
    image: redis:7-alpine
    container_name: ginchat-redis
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-changeme}
      --appendonly yes
      --maxmemory 128mb
      --maxmemory-policy allkeys-lru
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-changeme}
    volumes:
      - redis-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD:-changeme}\" ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - ginchat-network

  # ==================== MySQL 数据库 ====================
  mysql:
    image: mysql:8.0
    container_name: ginchat-mysql
    command: >
      --innodb-buffer-pool-size=128M
      --performance-schema=OFF
      --max-connections=100
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-changeme}
      MYSQL_DATABASE: ginchat
      TZ: Asia/Shanghai
    volumes:
      - ${MYSQL_VOLUME_NAME:-ginchat-mysql-data}:/var/lib/mysql
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    networks:
      - ginchat-network

volumes:
  redis-data:
  ginchat-mysql-data:
    name: ${MYSQL_VOLUME_NAME:-ginchat-mysql-data}

networks:
  ginchat-network:
    driver: bridge
